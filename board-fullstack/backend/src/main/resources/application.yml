server:
  port: 8080

spring:
  datasource:
    # 인메모리 H2. 서버를 재시작하면 데이터가 초기화된다.
    url: jdbc:h2:mem:boarddb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 엔티티 클래스를 보고 테이블을 자동 생성/삭제 (공부용 설정, 실무에서는 validate/none)
      ddl-auto: create-drop
    show-sql: true          # 실행되는 SQL을 콘솔에 출력
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true         # http://localhost:8080/h2-console 에서 DB 내용 확인 가능
      path: /h2-console
